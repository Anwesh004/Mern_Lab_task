<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="description" content="A simple and friendly item manager." />
    <title>Item Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main class="page-shell">
      <header class="page-heading">
        <span class="heading-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 8.5 16 4l9 4.5v15L16 28l-9-4.5v-15Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m7.5 9 8.5 4.4L24.5 9M16 13.4V27" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
        <p class="eyebrow">A LITTLE SPACE FOR YOUR THINGS</p>
        <h1>Item <span>Management</span></h1>
        <p class="page-subtitle">Add an item, keep track of its price, and make changes anytime.</p>
      </header>

      <section class="form-card panel" id="editor-card" aria-labelledby="form-title">
        <div class="card-heading">
          <div class="heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
          <div><p class="section-label" id="form-kicker">ADD AN ITEM</p><h2 id="form-title">Item details</h2></div>
        </div>

        <form id="item-form" novalidate>
          <div class="form-fields">
            <label for="name">Name</label>
            <div class="input-wrap"><input id="name" name="name" type="text" maxlength="80" placeholder="Enter item name" autocomplete="off" required /></div>
            <label for="price">Price</label>
            <div class="input-wrap price-wrap"><span aria-hidden="true">₹</span><input id="price" name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required /></div>
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div class="form-actions">
            <button class="cancel-button" id="cancel-edit" type="button" hidden>Cancel</button>
            <button class="primary-button" id="submit-button" type="submit"><span id="submit-label">Submit</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </form>
      </section>

      <section class="table-card panel" aria-label="Items">
        <div class="table-topline"><span class="section-label">YOUR ITEMS</span><span class="table-hint"><span class="live-dot"></span> Ready to update</span></div>
        <div class="table-scroll">
          <table>
            <thead><tr><th scope="col">ID</th><th scope="col">Name</th><th scope="col">Price</th><th scope="col">Action</th></tr></thead>
            <tbody id="item-list"></tbody>
          </table>
        </div>
      </section>

      <footer class="page-footer"><span>Simple things, well kept.</span><span class="footer-spark" aria-hidden="true">✳</span></footer>
    </main>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

    <dialog class="confirm-dialog" id="delete-dialog" aria-labelledby="dialog-title">
      <span class="dialog-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 7h15M9 7V4.5h6V7m-8 0 .8 12h8.4L17 7M10 10.5v5m4-5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <p class="section-label">REMOVE ITEM</p>
      <h2 id="dialog-title">Delete this item?</h2>
      <p class="dialog-copy">Are you sure you want to remove <strong id="delete-item-name"></strong>?</p>
      <div class="dialog-actions"><button class="cancel-button" id="keep-item" type="button">Keep item</button><button class="delete-button" id="confirm-delete" type="button">Delete</button></div>
    </dialog>
  </body>
</html>
